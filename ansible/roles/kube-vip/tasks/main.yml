---
- name: Ensure static pod manifest directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: '0755'

- name: Create hossts file for kube-vip (resolves 'kubernetes' to localhost)
  ansible.builtin.copy:
    content: "127.0.0.1 localhost kubernetes\n"
    dest: /etc/kube-vip.hosts
    mode: '0644'

- name: Deploy kube-vip static pod manifest
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: '0644'
